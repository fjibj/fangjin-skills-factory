<!-- 过渡页/片头骨架：一个功能的过渡页面，或片头页。
     风格自定，但保持与演示页面同一套观感(颜色/字体)。录制时延展示够时间供旁白停靠。 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1680px; height:940px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:28px;
    background:linear-gradient(160deg,#0a1424 0%, #10233f 55%, #142d52 100%);
    font-family:"Microsoft YaHei",sans-serif; color:#fff;
  }
  .no { font-size:22px; letter-spacing:8px; color:#7fb3ff; font-weight:600; }
  .fn { font-size:64px; font-weight:700; background:linear-gradient(90deg,#7fb3ff,#4db8ff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .desc { font-size:22px; color:#cfe0ff; opacity:.92; letter-spacing:2px; }
</style>
</head>
<body>
  <div class="no">01 · 功能序号</div>
  <div class="fn">功能名称</div>
  <div class="desc">支持图像与文本文件类型的功能一句话说明</div>
</body>
</html>
